name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app evals
      - run: mypy

  test:
    name: Tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q --junitxml=reports/junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-py${{ matrix.python }}
          path: reports/junit.xml

  redteam:
    name: Red-team eval (offline, must be 100%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt
      - run: python -m evals.run --suite redteam --provider mock --out reports
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: redteam-report
          path: reports/

  accuracy:
    name: Accuracy eval (Groq)
    # Runs on main and on manual dispatch; needs the GROQ_API_KEY repository secret.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      MIN_ACCURACY: ${{ vars.MIN_ACCURACY || '0.7' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt
      - name: Run accuracy suite
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "::notice::GROQ_API_KEY secret not set; skipping accuracy eval"
            exit 0
          fi
          python -m evals.run --suite accuracy --provider groq --min-accuracy "$MIN_ACCURACY" --out reports
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accuracy-report
          path: reports/

  security:
    name: Dependency & secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt -r requirements-otel.txt
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    name: Build image (push to GHCR on main)
    needs: [lint, test, redteam]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/sqlyapper:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/sqlyapper:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan image for critical vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/sqlyapper:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Smoke-test the container
        if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        run: |
          docker run -d --name sqly -p 8000:8000 \
            -e SQLY_LLM_PROVIDER=mock -e SQLY_SECRET_KEY="$(openssl rand -hex 32)" \
            ghcr.io/${{ github.repository_owner }}/sqlyapper:${{ github.sha }}
          for i in $(seq 1 30); do curl -fsS localhost:8000/health && break; sleep 1; done
          curl -fsS localhost:8000/ready
          docker logs sqly | tail -20
